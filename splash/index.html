<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xenapse Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #122133;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast;
    }
  </style>
</head>
<body>
  <img src="../assets/splash.png" alt="Xenapse Studio">
</body>
</html>
